<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Games – 2026 NA Coptic League</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #fff; min-height: 100vh; display: flex; flex-direction: column; color: #1a1a1a; }

/* ── Section title style ── */
.section { max-width: 700px; margin: 0 auto; padding: 22px 18px; }
.section-title { font-family: Arial, sans-serif; font-weight: 700; font-size: 1.2rem; color: #7d1a1a; text-align: center; margin-bottom: 14px; }

/* ── Filters ── */
.filters { background: #fff; padding: 16px; }
.filter-row { display: flex; gap: 12px; flex-wrap: wrap; max-width: 700px; margin: 0 auto; }
.fg { flex: 1; min-width: 140px; }
.fg label { display: block; font-family: Arial, sans-serif; font-style: italic; font-size: 0.72rem; font-weight: 700; color: #5c1010; text-transform: uppercase; letter-spacing: .12em; margin-bottom: 6px; text-align: center; }
.fg select { width: 100%; padding: 10px 12px; border: 2px solid #b8901c; border-radius: 4px; font-family: Arial, sans-serif; font-size: 0.9rem; font-weight: 600; color: #5c1010; background: #fff; cursor: pointer; }
.fg select:focus { outline: 2px solid #d4a73a; border-color: #d4a73a; }
.fg select:disabled { opacity: .55; cursor: not-allowed; }

/* ── Main ── */
.main { max-width: 700px; margin: 0 auto; padding: 22px 14px 40px; flex: 1; width: 100%; }

/* ── Empty ── */
.empty { background: #fff; border-radius: 8px; text-align: center; padding: 44px 22px; box-shadow: 0 2px 10px rgba(80,20,20,.08); }
.empty .icon { font-size: 2.4rem; margin-bottom: 10px; }
.empty h3 { font-family: Arial, sans-serif; font-style: italic; color: #7d1a1a; font-size: 1.05rem; margin-bottom: 8px; font-weight: 700; }
.empty p { font-size: 0.92rem; color: #555; line-height: 1.6; }

/* ── Stats bar ── */
.statsbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 7px; background: #7d1a1a; color: #d4a73a; padding: 7px 16px 7px 11px; border-radius: 22px; font-family: Arial, sans-serif; font-size: 0.9rem; font-weight: 700; box-shadow: 0 2px 6px rgba(125,26,26,.25); border: 1px solid #d4a73a; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #d4a73a; }
.cnt { font-size: 0.85rem; color: #5c1010; font-weight: 600; }

/* ── Day section ── */
.day-section { margin-bottom: 24px; }
.day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 6px 0; }
.day-name { font-family: Arial, sans-serif; font-style: italic; font-size: 1rem; font-weight: 700; color: #5c1010; white-space: nowrap; }
.day-count { font-size: 0.7rem; font-weight: 700; color: #5c1010; background: #d4a73a; padding: 2px 9px; border-radius: 10px; white-space: nowrap; border: 1px solid #b8901c; }
.day-line { display: none; }

/* ── Game card ── */
.card { background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(80,20,20,.08); padding: 14px 16px 14px 20px; margin-bottom: 10px; transition: box-shadow .15s; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #7d1a1a; }
.card:hover { box-shadow: 0 4px 14px rgba(80,20,20,.13); }
.card.win::before { background: #1a7d1a; }
.card.loss::before { background: #a02020; }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.time-main { font-family: Arial, sans-serif; font-size: 0.85rem; font-weight: 700; color: #7d1a1a; }
.result { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 5px; letter-spacing: 0.04em; }
.result.w { background: #1a7d1a; color: #fff; }
.result.l { background: #a02020; color: #fff; }
.result.tbd { background: #d4a73a; color: #5c1010; border: 1px solid #b8901c; }
.matchup { font-weight: 700; font-size: 1.02rem; color: #1a1a1a; line-height: 1.4; margin-bottom: 6px; }
.matchup .vs { color: #d4a73a; font-style: italic; font-size: 0.85rem; font-weight: 700; margin: 0 6px; }
.venue-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 600; color: #555; }
.venue-tag a { color: #2d3a8c; text-decoration: underline; font-weight: 600; }
.venue-tag a:hover { color: #1a2670; }

/* ── Spinner ── */
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e8d8b8; border-top-color: #7d1a1a; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media(max-width:520px) {
  .filter-row { flex-direction: column; }
  .fg { min-width: 100%; }
}
</style>
</head>
<body>

<div class="section">
  <div class="section-title">🏀 My Games</div>
</div>

<div class="filters">
  <div class="filter-row">
    <div class="fg">
      <label>Division</label>
      <select id="sdiv" onchange="onDiv()">
        <option value="">— Select Division —</option>
        <option value="HS-NY">High School — NY</option>
        <option value="HS-NJ">High School — NJ</option>
        <option value="JHS">Junior High (JHS)</option>
        <option value="Girls">Girls</option>
        <option value="College">College</option>
        <option value="Mens">Mens</option>
      </select>
    </div>
    <div class="fg">
      <label>Team</label>
      <select id="steam" onchange="onTeam()" disabled>
        <option value="">— Select Division First —</option>
      </select>
    </div>
  </div>
</div>

<div class="main"><div id="out">
  <div class="empty"><div class="icon">🏀</div><h3>Find Your Team's Schedule</h3><p>Select your division and team above<br>to view your team schedule.</p></div>
</div></div>

<script>
var VENUES = {
  HC:  {name:"Holy Child Catholic Church",       url:"https://maps.google.com/?q=4747+Amboy+Rd,+Staten+Island,+NY+10312"},
  BK:  {name:"St. George Community Center",       url:"https://maps.google.com/?q=6209+11th+Ave,+Brooklyn,+NY+11219"},
  EB:  {name:"St. Mark Coptic Christian Academy", url:"https://maps.google.com/?q=80+David+St,+South+River,+NJ+08882"},
  CYO: {name:"CYO MIV",                           url:"https://maps.google.com/?q=CYO+MIV"},
  SJN: {name:"St. John Neumann",                  url:"https://maps.google.com/?q=St+John+Neumann"},
  LI:  {name:"St. Mark Coptic Center LI",         url:"https://maps.google.com/?q=90+Woodbury+Rd,+Woodbury,+NY+11797"},
  GC:  {name:"Kimisis Tis Theotokou Greek Orthodox Church", url:"https://maps.google.com/?q=20+Hillcrest+Rd,+Holmdel,+NJ+07733"},
  MSK1:{name:"Multi Sports Kingdom — Court #1",   url:"https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746"},
  MSK2:{name:"Multi Sports Kingdom — Court #2",   url:"https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746"}
};

var TEAMS = {
  "HS-NY":  ["Astoria","Brooklyn (1)","Brooklyn (2)","Long Island (1)","Long Island (2)","Queens","SI1 (1)","SI1 (2)","SI2 (1)","SI2 (2)"],
  "HS-NJ":  ["Bayonne 1 (SASA) (1)","Bayonne 1 (SASA) (2)","Bayonne 2 (VMSJ) (1)","Bayonne 2 (VMSJ) (2)","Belleville","EB (1)","EB (2)","EB (3)","Holmdel","Makkar","Paramus","Philadelphia","Piscataway","Upstate","West Side"],
  "Girls":  ["Astoria","Bayonne 1 (SASA)","Belleville","Brooklyn","EB (1)","EB (2)","Holmdel","Makkar","Queens","SI1","SI2","SI3","Upstate"],
  "JHS":    ["Astoria","Bayonne 1 (SASA)","Bayonne 2 (VMSJ)","EB (1)","EB (2)","Holmdel","Makkar","Philadelphia","Queens","SI1","SI2","Summit","West Side"],
  "College":["Bayonne 1 (SASA)","Bayonne 2 (VMSJ)","Belleville","Brooklyn","EB (1)","EB (2)","EB (3)","Holmdel","Long Island","Philadelphia","Piscataway","Queens","SI1","SI2","Upstate"],
  "Mens":   ["Bayonne 1 (SASA)","EB","Hatfield","Holmdel","Long Island","Queens","SI1","SI2","Summit"]
};

var GAMES = [];
var GAMES_LOADED = false;

function loadGames() {
  var url = 'data/games.json?_=' + Date.now();
  fetch(url)
    .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(function(data){
      GAMES = Array.isArray(data) ? data : [];
      GAMES_LOADED = true;
      var team = document.getElementById('steam').value;
      if (team) onTeam();
    })
    .catch(function(err){
      document.getElementById('out').innerHTML = '<div class="empty"><div class="icon">⚠️</div><h3>Could not load games</h3><p>'+err.message+'</p></div>';
    });
}

function addHour(time){var p=time.split(' '),hm=p[0].split(':'),h=+hm[0],m=hm[1],ap=p[1],eh=h+1,eap=ap;if(h===11&&ap==='AM')eap='PM';if(eh>12)eh-=12;return p[0]+' '+ap+' – '+eh+':'+m+' '+eap;}
function fmtDateLong(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function timeSort(a,b){function to24(t){var p=t.split(' '),hm=p[0].split(':'),h=+hm[0],m=+hm[1];if(p[1]==='PM'&&h!==12)h+=12;if(p[1]==='AM'&&h===12)h=0;return h*60+m;}return to24(a.time)-to24(b.time);}

function onDiv(){
  var div=document.getElementById('sdiv').value,ts=document.getElementById('steam');
  ts.innerHTML='<option value="">— Select Team —</option>';
  if(div&&TEAMS[div]){TEAMS[div].forEach(function(t){var o=document.createElement('option');o.value=t;o.text=t;ts.appendChild(o);});ts.disabled=false;}
  else{ts.disabled=true;}
  document.getElementById('out').innerHTML='<div class="empty"><div class="icon">🏀</div><h3>Find Your Team\'s Schedule</h3><p>Now select your team.</p></div>';
}

function onTeam(){
  var div=document.getElementById('sdiv').value,team=document.getElementById('steam').value,out=document.getElementById('out');
  if(!team||!div)return;
  if(!GAMES_LOADED){
    out.innerHTML='<div class="empty"><div class="spinner"></div><h3>Loading games…</h3><p>One moment.</p></div>';
    return;
  }
  var f=GAMES.filter(function(g){return g.div===div&&(g.t1===team||g.t2===team);}).sort(timeSort);
  if(!f.length){out.innerHTML='<div class="empty"><div class="icon">📅</div><h3>No Games Yet</h3><p>Check back soon.</p></div>';return;}
  var wins=0,losses=0;
  f.forEach(function(g){if(!g.winner)return;var iWon=(g.winner==='t1'&&g.t1===team)||(g.winner==='t2'&&g.t2===team);if(iWon)wins++;else losses++;});
  var record=(wins>0||losses>0)?' &nbsp;|&nbsp; '+wins+'W – '+losses+'L':'';
  var h='<div class="statsbar"><div class="badge"><div class="dot"></div>'+team+'</div><div class="cnt">'+f.length+' game'+(f.length!==1?'s':'')+' &middot; '+div+record+'</div></div>';
  var by={};f.forEach(function(g){if(!by[g.date])by[g.date]=[];by[g.date].push(g);});
  Object.keys(by).sort().forEach(function(date){
    var games=by[date].sort(timeSort);
    h+='<div class="day-section"><div class="day-header"><span class="day-name">'+fmtDateLong(date)+'</span><span class="day-count">'+games.length+' game'+(games.length!==1?'s':'')+'</span><div class="day-line"></div></div>';
    games.forEach(function(g){
      var tr=addHour(g.time),vn=VENUES[g.v],vhtml=vn?'<span class="venue-tag">📍 <a href="'+vn.url+'" target="_blank">'+vn.name+'</a></span>':'';
      var opp=g.t1===team?g.t2:g.t1,rc='tbd',rt='TBD',cc='';
      if(g.winner){var iWon=(g.winner==='t1'&&g.t1===team)||(g.winner==='t2'&&g.t2===team);rc=iWon?'w':'l';var my=iWon?(g.winner==='t1'?g.s1:g.s2):(g.winner==='t1'?g.s2:g.s1),op=iWon?(g.winner==='t1'?g.s2:g.s1):(g.winner==='t1'?g.s1:g.s2);rt=(iWon?'W':'L')+(my?' '+my+'-'+op:'');cc=iWon?' win':' loss';}
      h+='<div class="card'+cc+'"><div class="card-top"><div class="time-main">'+tr+'</div><span class="result '+rc+'">'+rt+'</span></div><div class="matchup"><strong>'+team+'</strong><span class="vs">vs.</span>'+opp+'</div><div>'+vhtml+'</div></div>';
    });
    h+='</div>';
  });
  out.innerHTML=h;
}

loadGames();
</script>
</body>
</html>
