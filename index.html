<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Games — 2026 NA Coptic League</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial, sans-serif;background:#fff;}

/* ── Header ── */
.header{background:#7d1a1a;padding:18px 20px 16px;text-align:center;position:relative;overflow:hidden;}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#c9b5a5,#e07878,#c9b5a5);}
.header h1{font-family:Arial, sans-serif;font-size:1.55rem;color:#e8b4b4;font-weight:800;letter-spacing:.02em;}
.header .sub{font-size:.72rem;color:#c98a8a;margin-top:4px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;}

/* ── Filters ── */
.filters{background:#d8c8ba;border-bottom:2px solid #b8a492;padding:16px 16px 14px;}
.filter-row{display:flex;gap:12px;flex-wrap:wrap;max-width:700px;margin:0 auto;}
.fg{flex:1;min-width:140px;}
.fg label{display:block;font-size:.68rem;font-weight:700;color:#5c1010;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;font-family:Arial, sans-serif;}
.fg select{width:100%;padding:9px 12px;border:2px solid #b8a492;border-radius:6px;font-size:.88rem;font-weight:600;color:#5c1010;background:#fff;cursor:pointer;font-family:Arial, sans-serif;transition:border-color .2s;}
.fg select:focus{outline:none;border-color:#7d1a1a;box-shadow:0 0 0 3px rgba(125,26,26,.15);}
.fg select:disabled{opacity:.5;cursor:not-allowed;}

/* ── Main ── */
.main{max-width:700px;margin:0 auto;padding:16px 14px 28px;width:100%;}

/* ── Stats bar ── */
.statsbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
.badge{display:inline-flex;align-items:center;gap:7px;background:#7d1a1a;color:#fff;padding:6px 14px;border-radius:14px;font-size:.82rem;font-weight:700;font-family:Arial, sans-serif;}
.cnt{font-size:.82rem;color:#5c1010;font-weight:600;}

/* ── Day block ── */
.day-block{margin-bottom:24px;}
.day-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.day-name{font-family:Arial, sans-serif;font-size:1.05rem;font-weight:700;color:#5c1010;white-space:nowrap;}
.day-count{font-size:.7rem;font-weight:700;color:#fff;background:#7d1a1a;padding:2px 9px;border-radius:10px;white-space:nowrap;}
.day-line{flex:1;height:1px;background:#b8a492;}

/* ── Game card ── */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 6px rgba(80,20,20,.07);border:1px solid #eee4dc;padding:10px 14px 10px 18px;margin-bottom:7px;transition:background .15s;position:relative;overflow:hidden;}
.card:hover{background:#faf6f2;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#7d1a1a;}
.card.win::before{background:#1a6b1a;}
.card.loss::before{background:#a22;}
.card-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid #f0e6dd;}
.game-time{font-family:Arial, sans-serif;font-size:.82rem;font-weight:700;color:#5c1010;}
.result{display:inline-block;font-size:.66rem;font-weight:800;padding:3px 10px;border-radius:4px;letter-spacing:.06em;font-family:Arial, sans-serif;text-transform:uppercase;}
.result.w{background:#1a6b1a;color:#fff;}
.result.l{background:#a22;color:#fff;}
.result.tbd{background:#f0e6dd;color:#5c1010;}
.team-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;gap:10px;}
.team-row .team-name{font-size:.92rem;color:#555;font-weight:600;flex:1;min-width:0;}
.team-row .team-name .mine-mark{display:inline-block;font-size:.52rem;font-weight:800;color:#fff;background:#7d1a1a;padding:1px 5px;border-radius:3px;margin-left:6px;letter-spacing:.05em;vertical-align:middle;}
.team-row .team-score{font-size:1.05rem;color:#888;font-weight:700;min-width:32px;text-align:right;line-height:1;}
.team-row.win .team-name{color:#5c1010;font-weight:800;}
.team-row.win .team-score{color:#7d1a1a;font-weight:800;}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-top:6px;border-top:1px solid #f0e6dd;flex-wrap:wrap;gap:8px;}
.venue-tag{font-size:.74rem;color:#666;font-weight:600;}
.venue-tag a{color:#5c1010;text-decoration:underline;font-weight:700;}
.venue-tag a:hover{color:#7d1a1a;}
.div-tag{display:inline-block;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:3px;background:#7d1a1a;color:#fff;letter-spacing:.06em;text-transform:uppercase;}

/* ── Empty / Loading ── */
.empty{background:#fff;border-radius:10px;border:1px solid #eee4dc;text-align:center;padding:44px 22px;box-shadow:0 2px 10px rgba(80,20,20,.08);}
.empty .icon{font-size:2.4rem;margin-bottom:10px;}
.empty h3{font-family:Arial, sans-serif;color:#5c1010;font-size:1.05rem;margin-bottom:8px;font-weight:700;}
.empty p{font-size:.92rem;color:#666;line-height:1.6;}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #eee4dc;border-top-color:#7d1a1a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:520px){
  .filter-row{flex-direction:column;}
  .fg{min-width:100%;}
  .header h1{font-size:1.3rem;}
}
</style>
</head>
<body>

<div class="header">
  <h1>My Games — 2026 Season</h1>
  <div class="sub">NA Coptic League &middot; Find Your Schedule</div>
</div>

<div class="filters">
  <div class="filter-row">
    <div class="fg">
      <label>Division</label>
      <select id="sdiv" onchange="onDiv()">
        <option value="">— Select Division —</option>
        <option value="HS-NY">High School — NY</option>
        <option value="HS-NJ">High School — NJ</option>
        <option value="JHS">Junior High (JHS)</option>
        <option value="Girls">Girls</option>
        <option value="College">College</option>
        <option value="Mens">Mens</option>
      </select>
    </div>
    <div class="fg">
      <label>Team</label>
      <select id="steam" onchange="onTeam()" disabled>
        <option value="">— Select Division First —</option>
      </select>
    </div>
  </div>
</div>

<div class="main"><div id="out">
  <div class="empty"><div class="icon">🏀</div><h3>Find Your Team's Schedule</h3><p>Select your division and team above<br>to view your team schedule.</p></div>
</div></div>

<script>
var VENUES = {
  HC:  {name:"Holy Child Catholic Church",       url:"https://maps.google.com/?q=4747+Amboy+Rd,+Staten+Island,+NY+10312"},
  BK:  {name:"St. George Community Center",       url:"https://maps.google.com/?q=6209+11th+Ave,+Brooklyn,+NY+11219"},
  EB:  {name:"St. Mark Coptic Christian Academy", url:"https://maps.google.com/?q=80+David+St,+South+River,+NJ+08882"},
  CYO: {name:"CYO MIV",                           url:"https://maps.google.com/?q=CYO+MIV"},
  SJN: {name:"St. John Neumann",                  url:"https://maps.google.com/?q=St+John+Neumann"},
  LI:  {name:"St. Mark Coptic Center LI",         url:"https://maps.google.com/?q=90+Woodbury+Rd,+Woodbury,+NY+11797"},
  GC:  {name:"Kimisis Tis Theotokou Greek Orthodox Church", url:"https://maps.google.com/?q=20+Hillcrest+Rd,+Holmdel,+NJ+07733"},
  SGG: {name:"Saint George Greek Orthodox Church",          url:"https://maps.google.com/?q=818+Valley+Rd,+Clifton,+NJ+07013"},
  MSK1:{name:"Multi Sports Kingdom — Court #1",   url:"https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746"},
  MSK2:{name:"Multi Sports Kingdom — Court #2",   url:"https://maps.google.com/?q=2+Timber+Ln,+Marlboro+Township,+NJ+07746"}
};

var TEAMS = {
  "HS-NY":  ["Astoria","Brooklyn (1)","Brooklyn (2)","Long Island (1)","Long Island (2)","Queens","SI1 (1)","SI1 (2)","SI2 (1)","SI2 (2)"],
  "HS-NJ":  ["Bayonne 1 (SASA) (1)","Bayonne 1 (SASA) (2)","Bayonne 2 (VMSJ) (1)","Bayonne 2 (VMSJ) (2)","EB (1)","EB (2)","EB (3)","Holmdel","Makkar","Paramus","Philadelphia","Piscataway","Upstate","West Side"],
  "Girls":  ["Astoria","Bayonne 1 (SASA)","Belleville","Brooklyn","EB (1)","EB (2)","Holmdel","Makkar","Queens","SI1","SI2","SI3","Upstate"],
  "JHS":    ["Astoria","Bayonne 1 (SASA)","Bayonne 2 (VMSJ)","EB (1)","EB (2)","Holmdel","Makkar","Philadelphia","Queens","SI1","SI2","Summit","West Side"],
  "College":["Bayonne 1 (SASA)","Bayonne 2 (VMSJ)","Belleville","Brooklyn","EB (1)","EB (2)","EB (3)","Holmdel","Long Island","Philadelphia","Piscataway","Queens","SI1","SI2","Upstate"],
  "Mens":   ["Bayonne 1 (SASA)","EB","Hatfield","Holmdel","Long Island","Queens","SI1","SI2","Summit"]
};

var GAMES=[],GAMES_LOADED=false;

function loadGames(){
  fetch('data/games.json?_='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){
      GAMES=Array.isArray(d)?d:[];GAMES_LOADED=true;
      var team=document.getElementById('steam').value;
      if(team)onTeam();
    })
    .catch(function(err){
      document.getElementById('out').innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>Could not load games</h3><p>'+err.message+'</p></div>';
    });
}

function addHour(t){var p=t.split(' '),hm=p[0].split(':'),h=+hm[0],m=hm[1],ap=p[1],eh=h+1,eap=ap;if(h===11&&ap==='AM')eap='PM';if(eh>12)eh-=12;return p[0]+' '+ap+' – '+eh+':'+m+' '+eap;}
function fmtDateLong(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function timeSort(a,b){function to24(t){var p=t.split(' '),hm=p[0].split(':'),h=+hm[0],m=+hm[1];if(p[1]==='PM'&&h!==12)h+=12;if(p[1]==='AM'&&h===12)h=0;return h*60+m;}return to24(a.time)-to24(b.time);}

function onDiv(){
  var div=document.getElementById('sdiv').value,ts=document.getElementById('steam');
  ts.innerHTML='<option value="">— Select Team —</option>';
  if(div&&TEAMS[div]){TEAMS[div].forEach(function(t){var o=document.createElement('option');o.value=t;o.text=t;ts.appendChild(o);});ts.disabled=false;}
  else{ts.disabled=true;}
  document.getElementById('out').innerHTML='<div class="empty"><div class="icon">🏀</div><h3>Find Your Team\'s Schedule</h3><p>Now select your team.</p></div>';
}

function onTeam(){
  var div=document.getElementById('sdiv').value,team=document.getElementById('steam').value,out=document.getElementById('out');
  if(!team||!div)return;
  if(!GAMES_LOADED){
    out.innerHTML='<div class="empty"><div class="spinner"></div><h3>Loading games…</h3><p>One moment.</p></div>';return;
  }
  var f=GAMES.filter(function(g){return g.div===div&&(g.t1===team||g.t2===team);}).sort(timeSort);
  if(!f.length){out.innerHTML='<div class="empty"><div class="icon">📅</div><h3>No Games Yet</h3><p>Check back soon.</p></div>';return;}
  var wins=0,losses=0;
  f.forEach(function(g){if(!g.winner)return;var iWon=(g.winner==='t1'&&g.t1===team)||(g.winner==='t2'&&g.t2===team);if(iWon)wins++;else losses++;});
  var record=(wins>0||losses>0)?' &nbsp;|&nbsp; '+wins+'W – '+losses+'L':'';
  var h='<div class="statsbar"><div class="badge">'+team+'</div><div class="cnt">'+f.length+' game'+(f.length!==1?'s':'')+' &middot; '+div+record+'</div></div>';
  var by={};f.forEach(function(g){if(!by[g.date])by[g.date]=[];by[g.date].push(g);});
  Object.keys(by).sort().forEach(function(date){
    var games=by[date].sort(timeSort);
    h+='<div class="day-block"><div class="day-header"><span class="day-name">'+fmtDateLong(date)+'</span><span class="day-count">'+games.length+' game'+(games.length!==1?'s':'')+'</span><div class="day-line"></div></div>';
    games.forEach(function(g){
      var tr=addHour(g.time),vn=VENUES[g.v],vhtml=vn?'<span class="venue-tag">📍 <a href="'+vn.url+'" target="_blank">'+vn.name+'</a></span>':'<span></span>';
      var dtag='<span class="div-tag">'+div+'</span>';
      var played=(g.s1!=null&&g.s2!=null&&g.winner);
      var iWon=played&&((g.winner==='t1'&&g.t1===team)||(g.winner==='t2'&&g.t2===team));
      var cc=played?(iWon?' win':' loss'):'';
      var rc='tbd',rt='Upcoming';
      if(played){rc=iWon?'w':'l';rt=iWon?'Win':'Loss';}
      var t1n=g.t1,t2n=g.t2;
      var t1Mine=(t1n===team),t2Mine=(t2n===team);
      var t1Win=played&&g.winner==='t1',t2Win=played&&g.winner==='t2';
      var t1Score=played?g.s1:'',t2Score=played?g.s2:'';
      var t1Label=t1n+(t1Mine?' <span class="mine-mark">YOU</span>':'');
      var t2Label=t2n+(t2Mine?' <span class="mine-mark">YOU</span>':'');
      h+='<div class="card'+cc+'">'
       + '<div class="card-head"><span class="game-time">'+tr+'</span><span class="result '+rc+'">'+rt+'</span></div>'
       + '<div class="team-row'+(t1Win?' win':'')+'"><span class="team-name">'+t1Label+'</span><span class="team-score">'+t1Score+'</span></div>'
       + '<div class="team-row'+(t2Win?' win':'')+'"><span class="team-name">'+t2Label+'</span><span class="team-score">'+t2Score+'</span></div>'
       + '<div class="card-foot">'+vhtml+dtag+'</div>'
       + '</div>';
    });
    h+='</div>';
  });
  out.innerHTML=h;
}

loadGames();

function broadcastHeight(){window.parent.postMessage({type:'resize',height:document.body.scrollHeight},'*');}
window.addEventListener('load',broadcastHeight);
new MutationObserver(broadcastHeight).observe(document.body,{childList:true,subtree:true});
setInterval(broadcastHeight,500);
</script>
</body>
</html>
